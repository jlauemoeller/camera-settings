[workspace]
resolver = "3"
members = ["crates/camera-control", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
camera-control = { path = "crates/camera-control" }
nix = { version = "0.31", features = ["ioctl", "fs", "poll"] }
libc = "0.2"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
udev = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
