name: Setup build environment
description: System libraries, Node (from .tool-versions), Rust (from rust-toolchain.toml) and caches

inputs:
  rust:
    description: Install the Rust toolchain and cargo cache
    default: "true"

runs:
  using: composite
  steps:
    # Ubuntu equivalents of the dnf packages listed in README.md
    - name: Install system libraries
      if: inputs.rust == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libudev-dev \
          libssl-dev librsvg2-dev

    - uses: actions/setup-node@v5
      with:
        node-version-file: .tool-versions
        cache: npm

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    # rustup reads rust-toolchain.toml (channel and components)
    - name: Install Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
