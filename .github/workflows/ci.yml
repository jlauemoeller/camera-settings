name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml so tagged builds are tested too
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # tauri::generate_context! needs frontendDist (../dist) to exist at compile time
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Live BRIO tests are #[ignore]d and stay off here
      - run: cargo test --workspace --locked

  # Single stable check to require in branch protection
  ci:
    name: ci
    if: always()
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All checks passed"
