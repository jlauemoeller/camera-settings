name: Bundle

# Builds .deb/.rpm bundles for every commit on main that passed CI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      # Build the exact commit that went green, not whatever main points at now
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Build bundles
        run: npx tauri build --bundles deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: camera-settings-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
